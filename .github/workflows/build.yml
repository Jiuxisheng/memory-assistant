name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
    
    - name: Create local.properties
      run: |
        echo "flutter.sdk=${{ env.FLUTTER_ROOT }}" > android/local.properties
        echo "flutter.versionCode=1" >> android/local.properties
        echo "flutter.versionName=1.0.0" >> android/local.properties
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK (verbose)
      run: |
        flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tail -100
        echo "=== Checking build outputs ==="
        find build -name "*.apk" 2>/dev/null || echo "No APK found in build directory"
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk directory not found or empty"
    
    - name: Find APK
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" -type f 2>/dev/null
        echo "Listing build directory..."
        ls -la build/ 2>/dev/null || echo "build dir not found"
        ls -la build/app/ 2>/dev/null || echo "build/app dir not found"
        ls -la build/app/outputs/ 2>/dev/null || echo "outputs dir not found"
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          build/**/*.apk
        if-no-files-found: warn
    
    - name: Upload to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/*.apk
          build/**/*.apk
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
